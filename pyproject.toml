[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "mophi"
version = "0.1.0"
description = "Modular multi-physics co-simulation framework"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.15"
dependencies = [
    "newton==1.0.0",
    "warp-lang==1.12.1",
    "mujoco==3.6.0",
    "deme3>=3.0.5,<4",
    "xlb[cuda]",
    "torch",
    "GitPython",
    "PyYAML",
    "pycollada",
    "mujoco_warp==3.6.0",
    "pyglet",
    "imageio",
    "imageio-ffmpeg",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/Ruochun/MoPhi"
Repository = "https://github.com/Ruochun/MoPhi"
Issues = "https://github.com/Ruochun/MoPhi/issues"

[tool.scikit-build]
cmake.version = ">=3.18"
cmake.define.MOPHI_PYTHON_PACKAGING_BUILD = "ON"
sdist.include = ["external/MoPhiEssentials/**"]

[tool.cibuildwheel]
build = "cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp313-manylinux_x86_64 cp314-manylinux_x86_64"
test-command = "python -c 'import mophi; print(mophi.mophi_core.__file__)'"

[tool.black]
line-length = 120
target-version = ["py311"]
extend-exclude = '''
/(
    external
  | build
)/
'''
